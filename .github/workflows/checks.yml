name: Offline Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r host/requirements.txt pytest
      - name: Protocol, state, settings and Bluetooth unit tests
        run: >-
          python -m pytest -q host/test_protocol.py host/test_media_format.py
          host/test_ble_transport.py host/test_bluez_pairing.py host/test_link_fallback.py
          host/test_settings.py host/test_model_control.py host/test_codex_default.py
          host/test_resume_permissions.py host/test_client_presence.py
